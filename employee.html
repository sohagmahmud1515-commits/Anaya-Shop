<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>কর্মচারী তালিকা - Maya Garments</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4fbfa;
      color:#143d40;
    }

    .app{
      max-width:480px;
      margin:auto;
      min-height:100vh;
      padding-bottom:30px;
    }

    .topbar{
      background:white;
      padding:18px;
      display:flex;
      align-items:center;
      gap:14px;
      box-shadow:0 3px 12px rgba(0,0,0,.06);
      position:sticky;
      top:0;
      z-index:10;
    }

    .back{
      border:none;
      background:#e8faf5;
      width:42px;
      height:42px;
      border-radius:13px;
      font-size:22px;
      cursor:pointer;
    }

    .title h1{
      font-size:21px;
    }

    .title p{
      font-size:12px;
      color:#728888;
      margin-top:4px;
    }

    .summary{
      margin:18px;
      background:linear-gradient(135deg,#e2faf3,#ffffff);
      padding:18px;
      border-radius:20px;
      box-shadow:0 6px 18px rgba(0,0,0,.05);
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .summary small{
      color:#718484;
      font-size:13px;
    }

    .summary strong{
      display:block;
      font-size:30px;
      margin-top:5px;
      color:#0f766e;
    }

    .add-btn{
      border:none;
      background:#0f766e;
      color:white;
      padding:11px 15px;
      border-radius:12px;
      font-size:14px;
      cursor:pointer;
    }

    .search-box{
      margin:0 18px 15px;
    }

    .search-box input{
      width:100%;
      border:1px solid #d7e7e4;
      background:white;
      padding:13px 14px;
      border-radius:14px;
      outline:none;
      font-size:14px;
    }

    .list{
      padding:0 18px;
    }

    .employee-card{
      background:white;
      border-radius:18px;
      padding:15px;
      margin-bottom:12px;
      box-shadow:0 5px 16px rgba(0,0,0,.05);
      display:flex;
      align-items:center;
      gap:13px;
    }

    .avatar{
      width:48px;
      height:48px;
      border-radius:14px;
      background:#e7f7f3;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:22px;
      flex-shrink:0;
    }

    .info{
      flex:1;
      min-width:0;
    }

    .info h3{
      font-size:16px;
      margin-bottom:5px;
    }

    .info p{
      font-size:12px;
      color:#758585;
      margin:3px 0;
    }

    .id{
      font-size:11px;
      background:#eef8f6;
      color:#0f766e;
      padding:5px 8px;
      border-radius:8px;
      display:inline-block;
      margin-top:4px;
    }

    .empty{
      background:white;
      margin-top:15px;
      padding:35px 20px;
      text-align:center;
      border-radius:18px;
      color:#778888;
      box-shadow:0 5px 16px rgba(0,0,0,.04);
    }
  </style>
</head>

<body>

<div class="app">

  <div class="topbar">
    <button class="back" onclick="location.href='index.html'">←</button>

    <div class="title">
      <h1>কর্মচারী তালিকা</h1>
      <p>Maya Garments</p>
    </div>
  </div>

  <div class="summary">
    <div>
      <small>মোট কর্মচারী</small>
      <strong id="totalCount">0</strong>
    </div>

    <button class="add-btn" onclick="location.href='add-employee.html'">
      + নতুন কর্মচারী
    </button>
  </div>

  <div class="search-box">
    <input
      type="text"
      id="searchInput"
      placeholder="নাম, আইডি বা মোবাইল দিয়ে খুঁজুন"
      oninput="renderEmployees()"
    >
  </div>

  <div class="list" id="employeeList"></div>

</div>

<script>
  function getEmployees(){
    try{
      return JSON.parse(localStorage.getItem("mayaEmployees")) || [];
    }catch(e){
      return [];
    }
  }

  function renderEmployees(){
    const employees = getEmployees();
    const list = document.getElementById("employeeList");
    const search = document.getElementById("searchInput").value.trim().toLowerCase();

    document.getElementById("totalCount").innerText = employees.length;

    const filtered = employees.filter(emp => {
      const text = [
        emp.name,
        emp.employeeId,
        emp.id,
        emp.phone,
        emp.mobile,
        emp.designation,
        emp.position
      ].join(" ").toLowerCase();

      return text.includes(search);
    });

    if(filtered.length === 0){
      list.innerHTML = `
        <div class="empty">
          কোনো কর্মচারী পাওয়া যায়নি
        </div>
      `;
      return;
    }

    list.innerHTML = filtered.map((emp, index) => {

      const name = emp.name || "নাম দেওয়া হয়নি";
      const phone = emp.phone || emp.mobile || "মোবাইল নেই";
      const designation = emp.designation || emp.position || "পদবি দেওয়া হয়নি";
      const employeeId = emp.employeeId || emp.id || ("EMP-" + String(index + 1).padStart(3,"0"));

      return `
        <div class="employee-card">
          <div class="avatar">👤</div>

          <div class="info">
            <h3>${name}</h3>
            <p>📱 ${phone}</p>
            <p>💼 ${designation}</p>
            <span class="id">ID: ${employeeId}</span>
          </div>
        </div>
      `;
    }).join("");
  }

  document.addEventListener("DOMContentLoaded", renderEmployees);
</script>

</body>
</html>
