<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Maya Garments - Order Management</title>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f7f7;
    color:#143d40;
    padding-bottom:90px;
}

header{
    background:#0f7673;
    color:#fff;
    padding:16px 18px;
    position:sticky;
    top:0;
    z-index:20;
}

.header-row{
    max-width:760px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header-title{
    font-size:20px;
    font-weight:700;
}

.back-btn{
    color:#fff;
    text-decoration:none;
    font-size:24px;
}

.summary-btn{
    border:none;
    background:#fff;
    color:#0f7673;
    padding:9px 12px;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
}

.container{
    width:100%;
    max-width:760px;
    margin:auto;
    padding:16px;
}

/* GROUPS */

.groups{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-bottom:18px;
}

.group-card{
    background:#fff;
    border-radius:18px;
    padding:18px 12px;
    box-shadow:0 6px 18px rgba(0,0,0,.06);
    cursor:pointer;
    border:2px solid transparent;
}

.group-card.active{
    border-color:#0f8b83;
    background:#effdfa;
}

.group-icon{
    font-size:28px;
    margin-bottom:8px;
}

.group-title{
    font-weight:700;
    font-size:16px;
}

.group-count{
    margin-top:5px;
    color:#718789;
    font-size:13px;
}
