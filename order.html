<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Management</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7f7;
  color:#1d2433;
  padding-bottom:85px;
}

.header{
  background:#0f7673;
  color:#fff;
  padding:17px 25px;
  font-size:23px;
  font-weight:700;
}

.container{
  padding:18px 24px;
  max-width:760px;
  margin:auto;
}

.back{
  color:#147976;
  font-weight:700;
  font-size:18px;
  margin:15px 0 22px;
  cursor:pointer;
  display:inline-block;
}

/* =========================
   GROUP CARDS
========================= */

.group-card{
  background:#fff;
  border-radius:26px;
  padding:28px;
  margin:8px 0 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 6px 18px rgba(0,0,0,.06);
  cursor:pointer;
}

.group-left{
  display:flex;
  align-items:center;
  gap:22px;
}

.group-icon{
  width:88px;
  height:88px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
}

.blue-bg{background:#e5efff;}
.yellow-bg{background:#fff0bd;}
.red-bg{background:#ffe2e2;}

.group-title{
  font-size:25px;
  font-weight:700;
  margin-bottom:7px;
}

.group-sub{
  color:#92959c;
  font-size:17px;
}

.count{
  min-width:68px;
  height:68px;
  border-radius:50%;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:700;
}

.blue{background:#2f7be7;}
.yellow{background:#ed9500;}
.red{background:#f34747;}

/* =========================
   ORDER FORM
========================= */

.form-card{
  background:#fff;
  padding:24px;
  border-radius:25px;
  box-shadow:0 5px 18px rgba(0,0,0,.06);
  margin-bottom:28px;
}

.form-title{
  font-size:23px;
  font-weight:700;
  margin-bottom:18px;
}

.form-toggle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
}

.form-toggle span{
  font-size:20px;
  font-weight:700;
}

#formBody{
  margin-top:20px;
}

.input,
select,
textarea{
  width:100%;
  border:1px solid #d4d8da;
  background:#fff;
  border-radius:15px;
  padding:14px 15px;
  font-size:16px;
  outline:none;
  margin-bottom:12px;
}

textarea{
  min-height:115px;
  resize:vertical;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.image-box{
  border:1px dashed #9aa5aa;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
}

.image-label{
  display:block;
  text-align:center;
  background:#eef9f8;
  color:#137d77;
  padding:14px;
  border-radius:13px;
  font-weight:700;
  cursor:pointer;
}

#imageInput{
  display:none;
}

.preview-row{
  display:flex;
  gap:9px;
  overflow-x:auto;
  margin-top:12px;
}

.preview-wrap{
  position:relative;
  flex:0 0 auto;
}

.preview-wrap img{
  width:75px;
  height:75px;
  border-radius:10px;
  object-fit:cover;
  border:1px solid #ddd;
}

.remove-img{
  position:absolute;
  right:-5px;
  top:-5px;
  width:22px;
  height:22px;
  border-radius:50%;
  border:0;
  color:#fff;
  background:#f04444;
  cursor:pointer;
}

.tag-row{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:15px;
}

.tag{
  border:1px solid #d7dddd;
  padding:8px 12px;
  border-radius:20px;
  background:#fff;
  cursor:pointer;
  font-size:14px;
}

.tag.active{
  background:#def5f2;
  border-color:#15978e;
  color:#08756f;
}

.submit-btn{
  width:100%;
  border:none;
  background:#15978e;
  color:#fff;
  padding:16px;
  border-radius:15px;
  font-size:19px;
  font-weight:700;
  cursor:pointer;
}

/* =========================
   ORDER CARDS
========================= */

.section-title{
  font-size:23px;
  font-weight:700;
  margin:22px 0 15px;
}

.order-card{
  background:#fff;
  border:1px solid #e3e7e7;
  border-radius:20px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 4px 12px rgba(0,0,0,.04);
}

.order-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:11px;
}

.order-no{
  font-size:17px;
  font-weight:700;
}

.order-date{
  font-size:12px;
  color:#8a8d93;
}

.badges{
  display:flex;
  gap:6px;
  margin-bottom:9px;
  flex-wrap:wrap;
}

.badge-small{
  padding:5px 9px;
  border-radius:15px;
  font-size:12px;
  background:#e6f5f4;
  color:#08766f;
  font-weight:700;
}

.emergency-badge{
  background:#ffe7e7;
  color:#e33c3c;
}

.order-images{
  display:flex;
  gap:7px;
  overflow-x:auto;
  margin:10px 0;
}

.order-images img{
  width:82px;
  height:82px;
  object-fit:cover;
  border-radius:10px;
  cursor:pointer;
}

.details{
  font-size:15px;
  line-height:1.7;
}

.details b{
  color:#313640;
}

.order-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:12px;
}

.action-btn{
  border:none;
  border-radius:10px;
  padding:9px 12px;
  font-weight:700;
  cursor:pointer;
}

.emergency-btn{
  background:#fff0db;
  color:#d87900;
}

.courier-btn{
  background:#e2f5ed;
  color:#16805b;
}

.delete-btn{
  background:#ffe8e8;
  color:#d93737;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:73px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:100;
}

.nav-item{
  text-align:center;
  color:#898d95;
  text-decoration:none;
  font-size:14px;
  width:20%;
}

.nav-icon{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

.nav-item.active{
  color:#087a76;
  font-weight:700;
}

.hidden{
  display:none !important;
}

.empty{
  padding:35px 15px;
  text-align:center;
  color:#999;
}

@media(max-width:550px){
  .container{
    padding:17px 25px;
  }

  .group-card{
    padding:26px 28px;
  }

 .group-icon{
    width:65px;}
}
